name: Carmen Limbus Company Bot

on:
  schedule:
    - cron: "*/15 * * * *" # Tự động kiểm tra mỗi 15 phút 24/7
  workflow_dispatch: # Cho phép bấm chạy thử thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Carmen Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node bot.js

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_news.json || true
          git diff --staged --quiet || (git commit -m "chore: update last_news.json" && git push)
